<main class="app">
  <div id="acoes">
    <button
      id="gerar-relatorio"
      type="button"
      aria-label="Gerar relatório"
      title="Gerar relatório"
    >
      <svg
        viewBox="0 0 24 24"
        aria-hidden="true"
      >
        <path
          d="M6 3h12a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z"
        />
        <path d="M8 7h8M8 11h8M8 15h5" />
      </svg>
    </button>

    <button
      id="visualizar-dados"
      type="button"
      aria-label="Verificar dados salvos"
      title="Verificar dados salvos"
    >
      <svg
        viewBox="0 0 24 24"
        aria-hidden="true"
      >
        <ellipse cx="12" cy="5" rx="7" ry="3" />
        <path d="M5 5v7c0 1.7 3.1 3 7 3s7-1.3 7-3V5" />
        <path d="M5 12v7c0 1.7 3.1 3 7 3s7-1.3 7-3v-7" />
      </svg>
    </button>

    <button
      id="apagar-ultimo"
      type="button"
      aria-label="Apagar último registro"
      title="Apagar último registro"
    >
      <svg
        viewBox="0 0 24 24"
        aria-hidden="true"
      >
        <path d="M4 7h16" />
        <path d="M9 7V4h6v3" />
        <path d="M7 7l1 13h8l1-13" />
        <path d="M10 11v5M14 11v5" />
      </svg>
    </button>
  </div>

  <h1>Escriba (Controle Diário de Circulação)</h1>

  <section>
    <div>
      <h3>Modo</h3>

      <div id="modo">
        <button type="button" data-modo="automatico">
          Automático
        </button>

        <button type="button" data-modo="manual">
          Manual
        </button>
      </div>
    </div>

    <div>
      <h3>Data</h3>

      <button id="abrir-calendario" type="button">
        Abrir calendário
      </button>
    </div>

    <div>
      <h3>Período</h3>

      <div id="periodo"></div>
    </div>

    <div>
      <h3>Faixa etária</h3>

      <div id="faixa-etaria"></div>
    </div>

    <div>
      <h3>Público</h3>

      <div id="publico"></div>
    </div>

    <button id="registrar" type="button">
      REGISTRAR
    </button>
  </section>
</main>

<div
  id="toast"
  class="toast"
  role="status"
  aria-live="polite"
></div>

<div
  id="dados-modal"
  class="dados-modal"
  aria-hidden="true"
>
  <div
    class="dados-modal-conteudo"
    role="dialog"
    aria-modal="true"
    aria-labelledby="dados-modal-titulo"
  >
    <div class="dados-modal-cabecalho">
      <h2 id="dados-modal-titulo">
        Dados salvos
      </h2>

      <button
        id="fechar-dados"
        type="button"
        aria-label="Fechar dados salvos"
        title="Fechar"
      >
        ×
      </button>
    </div>

    <div class="dados-tabela-container">
      <table>
        <thead>
          <tr>
            <th>Data</th>
            <th>Hora</th>
            <th>Período</th>
            <th>Faixa etária</th>
            <th>Público</th>
          </tr>
        </thead>

        <tbody id="dados-tabela">
        </tbody>
      </table>
    </div>
  </div>
</div>
